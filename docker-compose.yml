services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8088:8000
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://Horilla:Horilla@145.223.22.51:3232/Horilla"
      ALLOWED_HOSTS: "yourdomain.com,www.yourdomain.com,localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://yourdomain.com,https://www.yourdomain.com,http://localhost:8000"
      DEBUG: "False"
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - ./media:/app/media
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
